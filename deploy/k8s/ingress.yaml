apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epub-reader
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  # CHANGE ME to the hostname you want. Also add it as a "Published
  # application route" on the k3s-cluster Cloudflare Tunnel
  # (-> http://traefik.kube-system.svc.cluster.local:80).
  - host: reader.dophamnguyen.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: epub-reader, port: {number: 80}}}
