# DO NOT COMMIT THIS FILE WITH REAL VALUES. Commit only the sealed output as
# apps/epub-reader/sealedsecret.yaml (see docs/ARCHITECTURE.md, "Quản lý
# secret"):
#
#   kubectl create secret generic epub-reader-secrets --namespace default \
#     --from-literal=ACCESS_PASSCODE='<passcode you type to log in>' \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | \
#   kubeseal --controller-namespace kube-system \
#     --controller-name sealed-secrets-controller -o yaml \
#     > sealedsecret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: epub-reader-secrets
  namespace: default
stringData:
  ACCESS_PASSCODE: change-me
  SESSION_SECRET: change-me-to-a-long-random-string
